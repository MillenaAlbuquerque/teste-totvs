<header class="demo-header">
  <img class="demo-logo" src="totvs-logo.png" alt="TOTVS" width="697" height="360" />
  <div class="header-acoes">
    <button
      class="botao-github"
      type="button"
      aria-label="GitHub"
      title="Ir para o repositório do GitHub"
      (click)="irParaGitHub()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        viewBox="0 0 640 640"
        fill="currentColor"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M280.5 426.5C214.5 418.5 168 371 168 309.5C168 284.5 177 257.5 192 239.5C185.5 223 186.5 188 194 173.5C214 171 241 181.5 257 196C276 190 296 187 320.5 187C345 187 365 190 383 195.5C398.5 181.5 426 171 446 173.5C453 187 454 222 447.5 239C463.5 258 472 283.5 472 309.5C472 371 425.5 417.5 358.5 426C375.5 437 387 461 387 488.5L387 540.5C387 555.5 399.5 564 414.5 558C505 523.5 576 433 576 321C576 179.5 461 64 319.5 64C178 64 64 179.5 64 321C64 432 134.5 524 229.5 558.5C243 563.5 256 554.5 256 541L256 501C249 504 240 506 232 506C199 506 179.5 488 165.5 454.5C160 441 154 433 142.5 431.5C136.5 431 134.5 428.5 134.5 425.5C134.5 419.5 144.5 415 154.5 415C169 415 181.5 424 194.5 442.5C204.5 457 215 463.5 227.5 463.5C240 463.5 248 459 259.5 447.5C268 439 274.5 431.5 280.5 426.5z"
        />
      </svg>
    </button>
    
    <button
      class="botao-linkedin"
      type="button"
      aria-label="LinkedIn"
      title="Ir para o perfil do LinkedIn"
      (click)="irParaLinkedin()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        viewBox="0 0 640 640"
        fill="currentColor"
        aria-hidden="true"
        focusable="false"
      >
        <path
          d="M196.3 512L103.4 512L103.4 212.9L196.3 212.9L196.3 512zM149.8 172.1C120.1 172.1 96 147.5 96 117.8C96 103.5 101.7 89.9 111.8 79.8C121.9 69.7 135.6 64 149.8 64C164 64 177.7 69.7 187.8 79.8C197.9 89.9 203.6 103.6 203.6 117.8C203.6 147.5 179.5 172.1 149.8 172.1zM543.9 512L451.2 512L451.2 366.4C451.2 331.7 450.5 287.2 402.9 287.2C354.6 287.2 347.2 324.9 347.2 363.9L347.2 512L254.4 512L254.4 212.9L343.5 212.9L343.5 253.7L344.8 253.7C357.2 230.2 387.5 205.4 432.7 205.4C526.7 205.4 544 267.3 544 347.7L544 512L543.9 512z"
        />
      </svg>
    </button>

    <button
      class="botao-tema"
      type="button"
      aria-label="Tema escuro"
      title="Alternar tema claro e escuro"
      [attr.aria-pressed]="temaEscuro()"
      (click)="temaAlterado.emit()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="30"
        height="30"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="lucide lucide-sun-moon preview-icon"
        aria-hidden="true"
        focusable="false"
      >
        <path d="M12 2v2" />
        <path
          d="M14.837 16.385a6 6 0 1 1-7.223-7.222c.624-.147.97.66.715 1.248a4 4 0 0 0 5.26 5.259c.589-.255 1.396.09 1.248.715"
        />
        <path d="M16 12a4 4 0 0 0-4-4" />
        <path d="m19 5-1.256 1.256" />
        <path d="M20 12h2" />
      </svg>
    </button>
  </div>
</header>
