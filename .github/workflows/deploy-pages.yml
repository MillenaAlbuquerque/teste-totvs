name: Publicar demo no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependências
        run: npm ci
      - name: Executar testes
        run: npm test -- --watch=false
      - name: Gerar aplicação
        run: npm run build -- --base-href /teste-totvs/
      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist/teste-totvs/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar aplicação
        id: deployment
        uses: actions/deploy-pages@v4
